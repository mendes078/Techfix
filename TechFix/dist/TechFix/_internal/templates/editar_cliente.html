{% extends "base.html" %}

{% block content %}

<section class="cadastro">

    <div class="page-header">
        <div>
            <h2>Editar cliente</h2>
            <p>Atualize as informações do cliente cadastrado.</p>
        </div>
    </div>

    <div class="form-container">

        {% if erro %}
            <div class="error-message">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label for="nome">Nome completo *</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    value="{{ request.form.get('nome', cliente.nome) }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="telefone">Telefone *</label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    value="{{ request.form.get('telefone', cliente.telefone) }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ request.form.get('email', cliente.email or '') }}"
                >
            </div>

            <div class="form-actions">

                <a href="{{ url_for('listar_clientes') }}" class="btn-secondary">
                    Cancelar
                </a>

                <button type="submit" class="btn-primary">
                    Salvar alterações
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
