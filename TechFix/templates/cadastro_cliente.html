{% extends "base.html" %}

{% block content %}

<section class="cadastro">

    <div class="page-header">
        <div>
            <h2>Novo cliente</h2>
            <p>Preencha as informações para cadastrar um cliente.</p>
        </div>
    </div>

    <div class="form-container">

        {% if erro %}
            <div class="error-message">
                {{ erro }}
            </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label for="nome">Nome completo *</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite o nome do cliente"
                    required
                >
            </div>

            <div class="form-group">
                <label for="telefone">Telefone *</label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="cliente@email.com"
                >
            </div>

            <div class="form-actions">

                <a href="{{ url_for('listar_clientes') }}" class="btn-secondary">
                    Cancelar
                </a>

                <button type="submit" class="btn-primary">
                    Salvar cliente
                </button>

            </div>

        </form>

    </div>

</section>

{% endblock %}
